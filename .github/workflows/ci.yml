name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: preppilot
          POSTGRES_PASSWORD: preppilot
          POSTGRES_DB: preppilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U preppilot -d preppilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Used by the API e2e test; matches the service container above.
      DATABASE_URL: postgres://preppilot:preppilot@localhost:5432/preppilot

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
